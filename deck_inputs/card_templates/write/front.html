  window.HANZI_CARD_SETTINGS = __HANZI_CARD_SETTINGS__;

  var frontBack = document.getElementById("back") ? "back" : "front";
  var WRITE_SETTINGS =
    (window.HANZI_CARD_SETTINGS && window.HANZI_CARD_SETTINGS[frontBack]) || {};

  function showHide(selector, isShow, style) {
    document.querySelectorAll(selector).forEach(function (element) {
      element.style.display = isShow ? style || "inline" : "none";

    showHide("#char_pinyin", WRITE_SETTINGS.show_pinyin);

  function openSidebar(id) {
    var sidebar = document.getElementById(id);
    if (sidebar) {
      sidebar.style.width = "160px";
    }
  }

  function closeSidebar(id) {
    var sidebar = document.getElementById(id);
    if (sidebar) {
      sidebar.style.width = "0";
    }

  document.addEventListener("click", function (event) {
    var moreInfoSidebar = document.getElementById("more-info-sidebar");

<script>
  function getWriterSize(configuredSize) {
    var configured = parseInt(configuredSize, 10);
    if (!isFinite(configured) || configured <= 0) {
      configured = 400;
    }

    var viewportWidth = 0;
    if (window.visualViewport && window.visualViewport.width) {
      viewportWidth = window.visualViewport.width;
    }
    if (document.documentElement && document.documentElement.clientWidth) {
      viewportWidth = viewportWidth
        ? Math.min(viewportWidth, document.documentElement.clientWidth)
        : document.documentElement.clientWidth;
    }
    if (window.innerWidth) {
      viewportWidth = viewportWidth
        ? Math.min(viewportWidth, window.innerWidth)
        : window.innerWidth;
    }

    var available = Math.floor(viewportWidth - 32);
    if (!isFinite(available) || available <= 0) {
      return configured;
    }
    return Math.max(100, Math.min(configured, available));
  }

  var configuredCharHW = parseInt(WRITE_SETTINGS.grid_size, 10);
  if (!isFinite(configuredCharHW) || configuredCharHW <= 0) {
    configuredCharHW = 400;
  }
  var charHW = getWriterSize(configuredCharHW);
  var charHeight = charHW;
  var charWidth = charHW;
  var configuredStrokeWidth = Number(WRITE_SETTINGS.stroke_width);
  if (!isFinite(configuredStrokeWidth) || configuredStrokeWidth <= 0) {
    configuredStrokeWidth = 64;
  }
  var strokeWidth = Math.max(
    2,
    Math.round(configuredStrokeWidth * (charHW / configuredCharHW)),
  );
  function getHintAfterMisses(value) {
    var parsed = parseInt(value, 10);
    return parsed > 0 ? parsed : false;
  }

  var strokeAfterMisses = getHintAfterMisses(WRITE_SETTINGS.hint_after_misses);
  var strokeLeniency = Number(WRITE_SETTINGS.stroke_leniency);
  if (!isFinite(strokeLeniency) || strokeLeniency <= 0) {
    strokeLeniency = 1;
  }

  function btnTapAudio() {
    var audio = new Audio();
    audio.src = "_press.mp3";
    audio.load();
    audio.play();
  }

  function collectAudioElements() {
    var audioDiv = document.getElementById("audio");
    if (!audioDiv) return [];
    var allChildren = audioDiv.getElementsByTagName("*");
    var audioElements = [];
    for (var i = 0; i < allChildren.length; i++) {
      var tag = allChildren[i].tagName;
      if (tag === "AUDIO" || tag === "A") {
        audioElements.push(allChildren[i]);
      }
    }
    return audioElements;
  }

  function playAudio() {
    var audioElements = collectAudioElements();
    if (audioElements.length === 0) return;

    function playNext(index) {
      if (index >= audioElements.length) return;
      var el = audioElements[index];
      if (el.tagName === "AUDIO") {
        el.onended = function () {
          playNext(index + 1);
        };
        el.play();
      } else {
        el.click();
        // Anki <a> sound links have no onended event; chain with a fixed delay
        setTimeout(function () {
          playNext(index + 1);
        }, 1500);
      }
    }
    playNext(0);
  }

  // change color
  var stroke_color = "#555";
  var outline_color = "#DDD";
  var drawing_color = "#333";

  if (document.body.classList.contains("night_mode")) {
    stroke_color = "#ffffff";
    outline_color = "#5B5B5B";
    drawing_color = "#fff";
  }

  function getToneColor(char) {
    stroke_color = "#555";
    if (document.body.classList.contains("night_mode")) {
      stroke_color = "#ffffff";
    }
    switch (char) {
      case "tone1":
        return "#f44336";
      case "tone2":
        return "#ff9800";
      case "tone3":
        return "#4caf50";
      case "tone4":
        return "#2196f3";
      case "tone0":
        return stroke_color;
      case "tone5":
        return stroke_color;
    }
  }

  function setStrokeColor(i) {
    var pinyinText = "{{Pinyin}}";
    var pinyinDiv = document.getElementById("char_pinyin");
    var colorizeHTML = pinyinWrapper().colorized_HTML_string_from_string(
      pinyinText,
      "pinYinWrapper",
      ["tone0", "tone1", "tone2", "tone3", "tone4"],
    );
    pinyinDiv.innerHTML = colorizeHTML;
    var charClass = document.querySelector(".pinYinWrapper").children;

    if (WRITE_SETTINGS.stroke_tone_color) {
      var toneColor = getToneColor(charClass[i].className);
      drawing_color = toneColor;
      stroke_color = toneColor;
    }
  }

  function setupAudioButton() {
    var button = document.getElementById("btnPlayAudio");
    if (!button) return;
    if (collectAudioElements().length === 0) {
      button.style.display = "none";
      return;
    }
    button.onclick = function () {
      playAudio();
    };
  }

  setupAudioButton();

  var stroke = WRITE_SETTINGS.show_grid ? "var(--surface1)" : "";

  var grid_data = `<svg xmlns='http://www.w3.org/2000/svg' width='100%' height='100%' class='grid-color'  id='grid-background-target'><g id="char_grid"><line x1='0' y1='0' x2='100%' y2='100%' stroke='${stroke}' /><line x1='100%' y1='0' x2='0' y2='100%' stroke='${stroke}' /><line x1='50%' y1='0' x2='50%' y2='100%' stroke='${stroke}' /><line x1='0' y1='50%' x2='100%' y2='50%' stroke='${stroke}' /></g></svg>`;

  function isHanzi(char) {
    var code = char.charCodeAt(0);
    return (
      (code >= 0x4e00 && code <= 0x9fff) ||
      (code >= 0x3400 && code <= 0x4dbf) ||
      (code >= 0x20000 && code <= 0x2ebef)
    );
  }

  function generateHanziOnFinishQuiz(style = "none", finish = false) {
    var drawGrid = document.getElementById("onfinish-character-target-div");
    drawGrid.innerHTML = "";
    drawGrid.style = "";
    drawGrid.style.position = "absolute";
    drawGrid.style.display = "grid";
    var size = 40;
    if (finish) {
      size = 100;
      drawGrid.style.position = "unset";
      drawGrid.style.display = "block";
      drawGrid.style.whiteSpace = "nowrap";
      drawGrid.style.overflow = "scroll";
    }

    for (i = 0; i < characters.length; i++) {
      var hanzi = characters[i];
      var span = document.createElement("span");
      if (isHanzi(hanzi)) {
        span.innerHTML = grid_data;
        span.children[0].id = "onfinish-grid-background-target" + i;
        span.children[0].style.margin = finish ? "6px" : "2px";
        span.style.display = style;
        drawGrid.appendChild(span);
        setStrokeColor(i);
        var writer = HanziWriter.create(
          "onfinish-grid-background-target" + i,
          hanzi,
          {
            width: size,
            height: size,
            padding: 5,
            strokeColor: stroke_color,
            charDataLoader: bundleCharDataLoader,
          },
        );
      } else {
        span.style.display = style;
        span.style.fontSize = size + "px";
        span.style.lineHeight = size + "px";
        span.style.margin = finish ? "6px" : "2px";
        span.style.verticalAlign = "middle";
        span.textContent = hanzi;
        drawGrid.appendChild(span);
      }
    }
  }

  function getQuizScoreSuggestion(state) {
    var score = Number(state.score) || 0;
    var isPerfect =
      score >= 100 &&
      (Number(state.totalStrokes) || 0) > 0 &&
      Number(state.correctStrokes) === Number(state.totalStrokes) &&
      (Number(state.mistakes) || 0) === 0 &&
      (Number(state.assists) || 0) === 0;
    if (isPerfect) {
      return { label: "Easy", className: "xh-score-easy" };
    }
    if (score >= 75) {
      return { label: "Good", className: "xh-score-good" };
    }
    if (score >= 60) {
      return { label: "Hard", className: "xh-score-hard" };
    }
    return { label: "Again", className: "xh-score-again" };
  }

  function getQuizScoreStorageKey() {
    return "xh-writer-score:" + characters + "::{{text:Pinyin}}";
  }

  function renderQuizScoreState(state) {
    var suggestion = getQuizScoreSuggestion(state);
    var panel = document.getElementById("xh-score-panel");
    var isBack = !!document.getElementById("back");
    var isRevealed = isBack || state.isComplete;

    if (!panel) {
      return;
    }

    document.getElementById("xh-score-value").textContent = isRevealed
      ? state.score + " / 100"
      : "-- / 100";
    document.getElementById("xh-score-suggestion").textContent = isRevealed
      ? suggestion.label
      : "--";
    document.getElementById("xh-score-strokes").textContent = isRevealed
      ? state.correctStrokes +
        " / " +
        (state.totalStrokes ? state.totalStrokes : "-")
      : state.correctStrokes;
    document.getElementById("xh-score-mistakes").textContent = state.mistakes;
    document.getElementById("xh-score-assists").textContent = state.assists;

    panel.classList.remove(
      "xh-score-again",
      "xh-score-hard",
      "xh-score-good",
      "xh-score-easy",
      "xh-score-redacted",
    );
    if (isRevealed) {
      panel.classList.add(suggestion.className);
    } else {
      panel.classList.add("xh-score-redacted");
    }
  }

  function saveQuizScoreState(state) {
    if (!(window.Persistence && Persistence.isAvailable())) {
      return;
    }
    Persistence.setItem(getQuizScoreStorageKey(), JSON.stringify(state));
  }

  function loadQuizScoreState() {
    if (!(window.Persistence && Persistence.isAvailable())) {
      return null;
    }
    try {
      return JSON.parse(Persistence.getItem(getQuizScoreStorageKey()));
    } catch (e) {
      return null;
    }
  }

  function restoreQuizScoreDisplay() {
    var savedState = loadQuizScoreState();
    if (savedState) {
      renderQuizScoreState(savedState);
    }
  }

  function createQuizScoreTracker(characterCount) {
    var mistakePenaltyStrokeRatio = 0.8;
    var revealAssistPenalty = 20;
    var hintPenaltyStrokeRatio = 1.2;
    var totalStrokesByChar = [];
    var correctStrokesByChar = [];
    var hintedStrokes = {};
    var mistakes = 0;
    var revealAssists = 0;
    var hintAssists = 0;
    var isComplete = false;

    for (var i = 0; i < characterCount; i++) {
      totalStrokesByChar.push(0);
      correctStrokesByChar.push(0);
    }

    function sum(values) {
      return values.reduce(function (total, value) {
        return total + (Number(value) || 0);
      }, 0);
    }

    function clampScore(value) {
      return Math.max(0, Math.min(100, Math.round(value)));
    }

    function updateDisplay() {
      var totalStrokes = sum(totalStrokesByChar);
      var correctStrokes = sum(correctStrokesByChar);
      var baseScore = totalStrokes ? (correctStrokes / totalStrokes) * 100 : 0;
      var pointsPerStroke = totalStrokes ? 100 / totalStrokes : 0;
      var mistakePenalty = pointsPerStroke * mistakePenaltyStrokeRatio;
      var assistPenalty =
        revealAssists * revealAssistPenalty +
        hintAssists * pointsPerStroke * hintPenaltyStrokeRatio;
      var assists = revealAssists + hintAssists;
      var score = clampScore(
        baseScore - mistakes * mistakePenalty - assistPenalty,
      );
      var state = {
        score: score,
        correctStrokes: correctStrokes,
        totalStrokes: totalStrokes,
        mistakes: mistakes,
        assists: assists,
        isComplete: isComplete,
      };

      renderQuizScoreState(state);
      saveQuizScoreState(state);
    }

    updateDisplay();

    return {
      setTotalStrokes: function (characterIndex, totalStrokes) {
        totalStrokesByChar[characterIndex] = Number(totalStrokes) || 0;
        updateDisplay();
      },
      markCorrectStroke: function (characterIndex, data) {
        correctStrokesByChar[characterIndex] = Math.max(
          correctStrokesByChar[characterIndex] || 0,
          Number(data.strokeNum) + 1,
        );
        updateDisplay();
      },
      markMistake: function () {
        mistakes++;
        updateDisplay();
      },
      markAssist: function () {
        revealAssists++;
        updateDisplay();
      },
      markComplete: function () {
        isComplete = true;
        updateDisplay();
      },
      markHint: function (characterIndex, strokeNum) {
        var key = characterIndex + ":" + strokeNum;
        if (!hintedStrokes[key]) {
          hintedStrokes[key] = true;
          hintAssists++;
          updateDisplay();
        }
      },
      getCurrentStroke: function (characterIndex) {
        return correctStrokesByChar[characterIndex] || 0;
      },
      getTotalStrokes: function (characterIndex) {
        return totalStrokesByChar[characterIndex] || 0;
      },
      isComplete: function () {
        return isComplete;
      },
    };
  }

  function doPractice(p = false) {
    if (document.getElementById("back")) {
      restoreQuizScoreDisplay();
      generateHanziOnFinishQuiz("unset", true);
      if (!p) {
        showNextAndRevealBtn(false);
        return;
      }
    } else {
      generateHanziOnFinishQuiz("none");
    }

    document.getElementById("ch_load_status").innerHTML = "&#8226;";
    document.getElementById("ch_load_status").style.marginBottom = "0px";
    document.getElementById("ch_load_status").style.display = "block";

    var hanziWriterList = [];
    var quizScore = createQuizScoreTracker(characters.length);
    window.xhActiveQuizScore = quizScore;
    var drawGrid = document.getElementById("character-target-div");
    drawGrid.innerHTML = "";

    for (var i = 0; i < characters.length; i++) {
      (function (characterIndex) {
        var div = document.createElement("div");
        div.id = "div" + characterIndex;
        var hanzi = characters[characterIndex];

        if (isHanzi(hanzi)) {
          div.innerHTML = grid_data;
          div.children[0].id = "grid-background-target" + characterIndex;
          drawGrid.appendChild(div);
          setStrokeColor(characterIndex);
          var writer = HanziWriter.create(
            "grid-background-target" + characterIndex,
            hanzi,
            {
              onLoadCharDataSuccess: function (data) {
                document.getElementById("ch_load_status").style.color =
                  "#4caf50";
                quizScore.setTotalStrokes(characterIndex, data.strokes.length);
              },
              onLoadCharDataError: function (reason) {
                document.getElementById("ch_load_status").style.color =
                  "#ea2322";
                console.error("HanziWriter data missing for:", hanzi, reason);
              },

              width: charWidth,
              height: charHeight,
              showCharacter: false,
              showOutline: WRITE_SETTINGS.show_outline,
              highlightOnComplete: true,
              highlightCompleteColor: stroke_color,
              drawingWidth: strokeWidth,
              strokeColor: stroke_color,
              outlineColor: outline_color,
              drawingColor: drawing_color,
              showHintAfterMisses: strokeAfterMisses,
              leniency: strokeLeniency,
              acceptBackwardsStrokes: false,
              markStrokeCorrectAfterMisses: false,
              padding: 5,
              charDataLoader: bundleCharDataLoader,
            },
          );

          writerQuiz(writer, characterIndex);
          hanziWriterList.push(writer);
        } else {
          div.style.fontSize = charHeight + "px";
          div.style.lineHeight = charHeight + "px";
          div.style.textAlign = "center";
          div.style.width = charWidth + "px";
          div.style.height = charHeight + "px";
          div.textContent = hanzi;
          drawGrid.appendChild(div);
          quizScore.setTotalStrokes(characterIndex, 0);
          hanziWriterList.push(null);
        }
      })(i);
    }

    var revealClickCount = 0;
    var goNextButton = document.getElementById("btnGoNextCard");
    if (goNextButton) {
      goNextButton.onclick = function () {
        revealClickCount = 0;
        btnTapAudio();
        var currentIndex = getCurrentHanziNum();
        var writer = hanziWriterList[currentIndex];
        if (writer) {
          quizScore.markAssist();
          writer.showOutline();
          writer.showCharacter();
          setTimeout(function () {
            onFinishQuizDrawHanzi();
          }, 800);
          setTimeout(function () {
            showNextHanzi();
          }, 1000);
        } else {
          onFinishQuizDrawHanzi();
          showNextHanzi();
        }
      };
    }

    var revealButton = document.getElementById("btnRevealChar");
    if (revealButton) {
      revealButton.onclick = function () {
        btnTapAudio();
        var currentIndex = getCurrentHanziNum();
        var writer = hanziWriterList[currentIndex];
        if (!writer) {
          onFinishQuizDrawHanzi();
          showNextHanzi();
          return;
        }
        quizScore.markAssist();
        writer.showOutline();
        if (revealClickCount == 0) {
          writer.animateCharacter();
        } else if (revealClickCount == 1) {
          writer.showCharacter();
        } else if (revealClickCount == 2) {
          writer.hideCharacter();
          writer.hideOutline();
          writerQuiz(writer, currentIndex);
        } else {
          revealClickCount = -1;
          writerQuiz(writer, currentIndex);
        }
        revealClickCount++;
      };
    }

    var hintButton = document.getElementById("btnHintStroke");
    if (hintButton) {
      hintButton.onclick = function () {
        var currentIndex = getCurrentHanziNum();
        var writer = hanziWriterList[currentIndex];
        if (!writer || quizScore.isComplete()) {
          return;
        }

        var strokeNum = quizScore.getCurrentStroke(currentIndex);
        if (strokeNum >= quizScore.getTotalStrokes(currentIndex)) {
          return;
        }

        btnTapAudio();
        quizScore.markHint(currentIndex, strokeNum);
        writer.highlightStroke(strokeNum);
      };
    }

    function writerQuiz(writer, characterIndex) {
      writer.quiz({
        onMistake: function (data) {
          quizScore.markMistake();
          if (strokeAfterMisses && data.mistakesOnStroke >= strokeAfterMisses) {
            quizScore.markHint(characterIndex, data.strokeNum);
          }
        },
        onCorrectStroke: function (data) {
          quizScore.markCorrectStroke(characterIndex, data);
        },
        onComplete: function (summaryData) {
          onFinishQuizDrawHanzi();
          revealClickCount = 0;

          setTimeout(function () {
            showNextHanzi();
          }, 1000);
        },
      });
    }

    function getCurrentHanziNum() {
      var characterDiv = document.querySelector("#character-target-div");
      var characterElements = characterDiv.children;
      var len = characterElements.length;
      for (var i = 0; i < len; i++) {
        var style = characterElements[i].style.display;
        if (style === "block" || style === "") {
          return i;
        }
      }
      return 0;
    }

    function onFinishQuizDrawHanzi() {
      var finishCharacterDiv = document.getElementById(
        "onfinish-character-target-div",
      );
      var characterElements = finishCharacterDiv.children;
      var len = characterElements.length;
      for (var i = 0; i < len; i++) {
        var style = characterElements[i].style.display;
        if (style === "none" || style === "") {
          characterElements[i].style.display = "unset";
          break;
        }
      }
    }
  }

  function showNextHanzi() {
    var characterDiv = document.querySelector("#character-target-div");
    var characterElements = characterDiv.children;
    var len = characterElements.length;

    for (i = 0; i < len; i++) {
      var style = characterElements[i].style.display;
      if (style === "block" || style === "") {
        characterElements[i].style.display = "none";
        characterElements[(i + 1) % characterElements.length].style.display =
          "block";
        onFinishQuiz(i, len);
        break;
      }
    }
  }

  function onFinishQuiz(i, len) {
    if (i != len - 1) {
      return;
    }

    if (i + 1 == len) {
      document.querySelector("#character-target-div").innerHTML = "";
      document.getElementById("ch_load_status").style.display = "none";
      generateHanziOnFinishQuiz("unset", true);
      if (window.xhActiveQuizScore) {
        window.xhActiveQuizScore.markComplete();
      }
    }

    showHide("#btnHintStroke", false);
    playAudio();
    showHide("#char_sim", true, "block");
    showHide("#char_meaning", true, "block");
    if (WRITE_SETTINGS.show_pinyin) {
      showHide(".pinyin", true);
    }
    showNextAndRevealBtn(false);
  }

  function showNextAndRevealBtn(show) {
    showHide("#btnGoNextCard", show);
    showHide("#btnRevealChar", show);
  }

  doPractice();
</script>
