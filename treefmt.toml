[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.ruff]
command = "ruff"
options = ["format"]
includes = [
  "tooling/build/*.py",
  "tooling/lib/**/*.py",
  "tooling/utilities/diff_apkg.py",
  "tooling/utilities/update_cc_cedict_snapshot.py",
]
excludes = ["tooling/utilities/migrate-*.py"]
