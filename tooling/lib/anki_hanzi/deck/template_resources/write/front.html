<div class="header">
  Write the <span class="question-sub-text">character</span>.
</div>

<br />

<div id="char_pinyin">{{Pinyin}}</div>
<div id="char_sim" class="char-card">{{Simplified}}</div>
<div id="onfinish-character-target-div" class="tappable"></div>
<div id="xh-writer-practice-wrap">
  <div id="xh-score-panel" class="xh-score-redacted" aria-live="polite">
    <div class="xh-score-main xh-score-result-row">
      <span class="xh-score-label">Score</span>
      <span id="xh-score-value">Hidden</span>
    </div>
    <div class="xh-score-row xh-score-suggestion-row">
      <span class="xh-score-label">Suggestion</span>
      <span id="xh-score-suggestion">--</span>
    </div>
    <div class="xh-score-row">
      <span class="xh-score-label">Completed</span>
      <span id="xh-score-strokes">0</span>
    </div>
    <div class="xh-score-row">
      <span class="xh-score-label">Mistakes</span>
      <span id="xh-score-mistakes">0</span>
    </div>
    <div class="xh-score-row">
      <span class="xh-score-label">Assists</span>
      <span id="xh-score-assists">0</span>
    </div>
  </div>
  <div id="character-target-div" class="tappable"></div>
</div>
<div
  id="ch_load_status"
  style="color: #ea2322; margin-top: -36px; display: none"
>
  &#8226;
</div>
<div id="audio" style="display: none">{{Audio}}</div>

<style>
  #btnMoreOptions {
    display: none;
  }

  #back #btnMoreOptions {
    display: inline-block;
  }

  #back #btnHintStroke {
    display: none;
  }
</style>

<div class="modal-footer1">
  <a class="btn" id="btnPlayAudio">
    <div class="icon">
      <span class="material-symbols-outlined">play_arrow</span>
    </div>
  </a>
  <a class="btn" id="btnHintStroke" title="Hint" aria-label="Hint">
    <div class="icon">
      <span class="material-symbols-outlined">lightbulb</span>
    </div>
  </a>
  <a class="btn" id="btnRevealChar" style="display: none">
    <div class="icon">
      <span class="material-symbols-outlined">gesture</span>
    </div>
  </a>
  <a class="btn" id="btnGoNextCard" style="display: none">
    <div class="icon">
      <span class="material-symbols-outlined">navigate_next</span>
    </div>
  </a>
  <a class="btn" id="btnMoreOptions" onclick="openSidebar('more-info-sidebar')">
    <div class="icon">
      <span class="material-symbols-outlined">more_vert</span>
    </div>
  </a>
</div>

<hr />

<div id="char_meaning" class="meaning-card">{{Meaning}}</div>
